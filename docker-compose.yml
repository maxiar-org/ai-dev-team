name: ai-dev-team

services:
  canvas:
    build: ./canvas
    image: ai-dev-team/canvas:1.24.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LOCAL_BACKEND_API_KEY: ${CANVAS_API_KEY:?falta CANVAS_API_KEY en .env}
      # El entrypoint solo exporta esta variable si LOCAL_BACKEND_API_KEY está vacía;
      # sin ella el agent server acepta pedidos sin clave.
      OH_SESSION_API_KEYS_0: ${CANVAS_API_KEY}
      OH_SECRET_KEY: ${OH_SECRET_KEY:?falta OH_SECRET_KEY en .env}
      AGENT_CANVAS_DISABLE_TELEMETRY: "1"
      # Suscripciones (opción C del spec). Para el respaldo pagado ver README.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CODEX_AUTH_JSON: ${CODEX_AUTH_JSON:-}
      # gh y git dentro de las conversaciones actúan como maxiar-ai-dev-team-bot.
      GH_TOKEN: ${GITHUB_TOKEN:?falta GITHUB_TOKEN en .env}
    volumes:
      - canvas-state:/home/openhands/.openhands
      - codex-home:/home/openhands/.codex
      - projects:/projects

  dispatcher:
    build: ./dispatcher
    restart: unless-stopped
    depends_on:
      - canvas
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_ORG: ${GITHUB_ORG:-maxiar-org}
      REPOS: ${REPOS:?falta REPOS en .env}
      ALLOWED_USERS: ${ALLOWED_USERS:?falta ALLOWED_USERS en .env}
      BOT_LOGIN: ${BOT_LOGIN:-maxiar-ai-dev-team-bot}
      DEFAULT_DEV_ENGINE: ${DEFAULT_DEV_ENGINE:-codex}
      PROJECT_NUMBER: ${PROJECT_NUMBER:-}
      QA_ENGINE: ${QA_ENGINE:-codex}
      DOCS_ENGINE: ${DOCS_ENGINE:-claude}
      DOCS_ONLY_REPOS: ${DOCS_ONLY_REPOS:-}
      HEARTBEAT_PATH: /state/heartbeat
      CANVAS_URL: http://canvas:8000
      CANVAS_API_KEY: ${CANVAS_API_KEY}
      PROJECTS_DIR: /projects
      STATE_PATH: /state/state.json
      METRICS_PATH: /pilot/metrics.csv
      ROLES_DIR: /app/roles
    volumes:
      - projects:/projects
      - dispatcher-state:/state
      - ./roles:/app/roles:ro
      - ./pilot:/pilot

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    networks: [default, coolify]  # para enrutar coolify.maxiar.dev y *.maxiar.dev al proxy de Coolify
    environment:
      # Si falta, cloudflared no conecta y el watchdog abre [ops] tunel.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - canvas

  watchdog:
    image: ai-dev-team-dispatcher
    pull_policy: never  # la construye el servicio dispatcher
    restart: unless-stopped
    depends_on:
      - dispatcher
    entrypoint: ["python", "-m", "dispatcher.watchdog"]
    networks: [default, coolify]
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_ORG: ${GITHUB_ORG:-maxiar-org}
      OPS_REPO: ai-dev-team
      WATCHDOG_INTERVAL: "120"  # 2 fallas seguidas → alerta en ~7-9 min tras una caída
      CANVAS_URL: http://canvas:8000
      CANVAS_API_KEY: ${CANVAS_API_KEY}
      HEARTBEAT_PATH: /state/heartbeat
      TUNNEL_READY_URL: http://cloudflared:2000/ready
      DISK_PATH: /
      GITHUB_TOKEN_EXPIRES: ${GITHUB_TOKEN_EXPIRES:-}
      CLAUDE_TOKEN_EXPIRES: ${CLAUDE_TOKEN_EXPIRES:-}
      COOLIFY_HEALTH_URL: ${COOLIFY_HEALTH_URL:-}
    volumes:
      - dispatcher-state:/state:ro

  # Vista de estado (estado.maxiar.dev, detrás de Access): solo lectura, sin puertos publicados.
  estado:
    image: ai-dev-team-dispatcher
    pull_policy: never  # la construye el servicio dispatcher
    restart: unless-stopped
    depends_on:
      - dispatcher
    entrypoint: ["python", "-m", "dispatcher.estado"]
    networks: [default, coolify, resumen]
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_ORG: ${GITHUB_ORG:-maxiar-org}
      REPOS: ${REPOS}
      BOT_LOGIN: ${BOT_LOGIN:-maxiar-ai-dev-team-bot}
      OPS_REPO: ai-dev-team
      CANVAS_URL: http://canvas:8000
      CANVAS_API_KEY: ${CANVAS_API_KEY}
      HEARTBEAT_PATH: /state/heartbeat
      STATE_PATH: /state/state.json
      METRICS_PATH: /pilot/metrics.csv
      TUNNEL_READY_URL: http://cloudflared:2000/ready
      COOLIFY_HEALTH_URL: ${COOLIFY_HEALTH_URL:-}
      COOLIFY_API_URL: http://coolify:8080/api/v1
      COOLIFY_API_TOKEN: ${COOLIFY_API_TOKEN:-}
      GITHUB_TOKEN_EXPIRES: ${GITHUB_TOKEN_EXPIRES:-}
      CLAUDE_TOKEN_EXPIRES: ${CLAUDE_TOKEN_EXPIRES:-}
      RESUMEN_URL: http://operador:8091
      RESUMEN_TOKEN: ${RESUMEN_TOKEN:-}
      ESTADO_ORIGIN: https://estado.maxiar.dev
    volumes:
      - dispatcher-state:/state:ro
      - ./pilot:/pilot:ro

  operador:
    build:
      context: ./operador
      args:
        UID: ${AIDEV_UID:-1001}
        GID: ${AIDEV_GID:-1001}
    restart: unless-stopped
    init: true
    group_add:
      - "${DOCKER_GID:-999}"  # grupo docker del host, para usar docker.sock
    networks: [default, resumen]
    environment:
      RESUMEN_TOKEN: ${RESUMEN_TOKEN:-}  # servidor de resúmenes a pedido (operador/resumen.py, :8091)
    volumes:
      - operador-home:/home/aidev
      - .:/opt/ai-dev-team
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  canvas-state:
  codex-home:
  projects:
  dispatcher-state:
  operador-home:

networks:
  coolify:
    external: true  # la crea el instalador de Coolify (/data/coolify)
    name: coolify
  resumen:
    internal: true  # solo estado <-> operador (pedidos de resumen); Canvas no la ve
